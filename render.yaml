# Render Deployment Configuration
# This file tells Render how to deploy your Node.js backend

# Build Command (runs before starting the app)
buildCommand: npm install

# Start Command (how to run your app)
startCommand: npm start

# Node.js Version
nodeVersion: 22

# Environment Variables (set these in Render dashboard)
# PORT: 10000 (Render sets this automatically)
# MONGODB_URI: your_mongodb_atlas_connection_string
# FRONTEND_URL: https://your-vercel-app.vercel.app
# AI_API_KEY: your_gemini_api_key (optional)
# EMAIL_USER: your_email@gmail.com (optional)
# EMAIL_PASS: your_app_password (optional)

# Health Check Path
healthCheckPath: /health

# Auto-Deploy
# Set to true in Render dashboard for automatic deployments from GitHub